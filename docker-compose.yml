version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nexus-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nexus-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexus-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - PRODUCTION_FRONTEND_URL=${PRODUCTION_FRONTEND_URL}
    depends_on:
      - mongodb
    networks:
      - nexus-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nexus-client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - nexus-network

volumes:
  mongo-data:

networks:
  nexus-network:
    driver: bridge
